name: didigo
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.69.0

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.9.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^16.0.0

  # Local Storage
  flutter_secure_storage: ^9.2.4

  # UI
  google_fonts: ^6.3.1
  intl: ^0.20.2
  flutter_svg: ^2.2.0
  lottie: ^3.3.2

  # Environment
  flutter_dotenv: ^5.2.1

  # Utility
  uuid: ^4.5.1
  equatable: ^2.0.7
  image_picker: ^1.2.3
  timezone: ^0.11.1
  flutter_local_notifications: ^22.3.1
  cached_network_image: ^3.4.1
  confetti: ^0.8.0
  package_info_plus: ^9.0.1
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

  build_runner: ^2.5.4
  freezed: ^3.2.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  json_serializable: ^6.11.1

dependency_overrides:
  archive: 4.5.2

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon2.png"
  adaptive_icon_background: "#FFB400"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/